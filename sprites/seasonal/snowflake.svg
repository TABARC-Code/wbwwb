<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Snowflake (Winter) - Geometric, minimalist -->
  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main vertical line -->
    <line x1="32" y1="8" x2="32" y2="56"/>
    <!-- Horizontal line -->
    <line x1="8" y1="32" x2="56" y2="32"/>
    <!-- Diagonals -->
    <line x1="16" y1="16" x2="48" y2="48"/>
    <line x1="48" y1="16" x2="16" y2="48"/>

    <!-- Upper branches -->
    <line x1="32" y1="16" x2="24" y2="22"/>
    <line x1="32" y1="16" x2="40" y2="22"/>

    <!-- Right branches -->
    <line x1="48" y1="32" x2="42" y2="24"/>
    <line x1="48" y1="32" x2="42" y2="40"/>

    <!-- Lower branches -->
    <line x1="32" y1="48" x2="24" y2="42"/>
    <line x1="32" y1="48" x2="40" y2="42"/>

    <!-- Left branches -->
    <line x1="16" y1="32" x2="22" y2="24"/>
    <line x1="16" y1="32" x2="22" y2="40"/>

    <!-- Diagonal branches -->
    <line x1="40" y1="24" x2="36" y2="20"/>
    <line x1="40" y1="24" x2="44" y2="28"/>
    <line x1="40" y1="40" x2="44" y2="36"/>
    <line x1="40" y1="40" x2="36" y2="44"/>
    <line x1="24" y1="24" x2="20" y2="20"/>
    <line x1="24" y1="24" x2="28" y2="28"/>
    <line x1="24" y1="40" x2="28" y2="36"/>
    <line x1="24" y1="40" x2="20" y2="44"/>
  </g>
</svg>
