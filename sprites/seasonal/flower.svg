<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Flower (Spring) - Simple petals around center -->
  <g fill="currentColor">
    <!-- Center circle -->
    <circle cx="32" cy="32" r="6"/>

    <!-- Petals (5 simple shapes around center) -->
    <!-- Top petal -->
    <ellipse cx="32" cy="14" rx="5" ry="8"/>
    <!-- Top-right petal -->
    <ellipse cx="43" cy="19" rx="5" ry="8" transform="rotate(72 43 19)"/>
    <!-- Bottom-right petal -->
    <ellipse cx="43" cy="45" rx="5" ry="8" transform="rotate(144 43 45)"/>
    <!-- Bottom-left petal -->
    <ellipse cx="21" cy="45" rx="5" ry="8" transform="rotate(216 21 45)"/>
    <!-- Top-left petal -->
    <ellipse cx="21" cy="19" rx="5" ry="8" transform="rotate(288 21 19)"/>
  </g>

  <!-- Stem -->
  <line x1="32" y1="38" x2="32" y2="56" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
